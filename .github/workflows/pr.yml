# PR checks for this repo, through the same reusable workflows every other repo calls.
# The scripts come from the PR's own head commit, so a change to a check is tested by itself.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

# issues/pull-requests read: the regression-test job reads who applied no-regression-test.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-check:
    uses: ./.github/workflows/pr-check.yml
    with:
      shared-ci-ref: ${{ github.event.pull_request.head.sha }}

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    with:
      shared-ci-ref: ${{ github.event.pull_request.head.sha }}
