# Reusable CI for BTWL Python repos, same shape as ci-node.yml:
# make setup (uv sync --frozen), then make ci (ruff, mypy, pytest --cov, uv build), then the
# coverage floor. Python 3.12 is the supported line; the repo pins it in .python-version.
name: ci-python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with pyproject.toml, uv.lock, .python-version and the Makefile
        type: string
        default: .
      coverage-path:
        description: Coverage output to upload as an artifact, relative to working-directory
        type: string
        default: coverage.json
      coverage-summary:
        description: Coverage summary read by the floor check (pytest --cov-report=json)
        type: string
        default: coverage.json
      coverage-floor:
        description: Minimum total line coverage in percent; 0 turns the check off
        type: number
        default: 80
      junit-path:
        description: JUnit XML written by make test, relative to working-directory
        type: string
        default: reports/junit.xml
      shared-ci-ref:
        description: Ref of prizmatoo/.github whose scripts run the coverage check
        type: string
        default: main
    secrets:
      shared-ci-token:
        description: Read-only token for prizmatoo/.github (private repo); falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      # Without these, uv would resolve afresh and pick the newest Python instead of failing.
      - name: Check the Python project
        env:
          DIR: ${{ inputs.working-directory }}
        run: |
          for f in pyproject.toml uv.lock .python-version; do
            test -s "$f" || { echo "::error title=ci-python::$f is missing in $DIR"; exit 1; }
          done
          echo "Python $(cat .python-version), lockfile uv.lock"

      # Python version comes from the repo's .python-version.
      - name: Install Python
        run: uv python install

      - name: make setup
        run: make setup

      # ruff reads RUFF_OUTPUT_FORMAT, so lint findings show on the PR's files as annotations.
      - name: make ci
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make ci

      # A green make ci without a JUnit report means make test stopped writing it.
      - name: Check the JUnit report exists
        env:
          JUNIT: ${{ inputs.junit-path }}
        run: test -s "$JUNIT" || { echo "::error title=junit::make test did not write $JUNIT"; exit 1; }

      # The floor check is the same Node script ci-node runs.
      - name: Check out shared CI scripts
        uses: actions/checkout@v4.2.2
        with:
          repository: prizmatoo/.github
          ref: ${{ inputs.shared-ci-ref }}
          path: .shared-ci
          token: ${{ secrets.shared-ci-token || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.0

      - name: Coverage floor
        env:
          SUMMARY: ${{ inputs.coverage-summary }}
          FLOOR: ${{ inputs.coverage-floor }}
        run: node "$GITHUB_WORKSPACE/.shared-ci/scripts/coverage-floor.js" "$SUMMARY" --floor "$FLOOR"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: warn
          retention-days: 14

      # Test results for the Xray import (BTWL-138): one artifact per repo and commit.
      # Also on failure: failing runs are the ones QA needs to see in Xray.
      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: junit-${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/${{ inputs.junit-path }}
          if-no-files-found: warn
          retention-days: 30
