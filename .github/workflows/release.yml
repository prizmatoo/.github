# Reusable release build for BTWL packages, run on a v<semver> tag.
#
# It checks the tag against package.json, runs make setup and make ci, packs the tagged version
# with npm pack and uploads the tarball together with the release notes cut from CHANGELOG.md.
#
# It does NOT publish the package and does NOT create the GitHub release. Nothing on BTWL repos is
# written by github-actions[bot] (no-bots rule), so GITHUB_TOKEN stays read-only here. The component
# lead downloads the artifact, publishes it to GitHub Packages with their own token and creates the
# release from release-notes.md (OPS "Release process v1").
name: release

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json, CHANGELOG.md and the Makefile
        type: string
        default: .
      shared-ci-ref:
        description: Ref of prizmatoo/.github whose scripts check the tag and cut the notes
        type: string
        default: main
    secrets:
      shared-ci-token:
        description: Read-only token for prizmatoo/.github (private repo); falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  pack:
    name: build and pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: make setup
        run: make setup

      - name: make ci
        run: make ci

      - name: Check out shared CI scripts
        uses: actions/checkout@v4.2.2
        with:
          repository: prizmatoo/.github
          ref: ${{ inputs.shared-ci-ref }}
          path: .shared-ci
          token: ${{ secrets.shared-ci-token || github.token }}
          persist-credentials: false

      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: node "$GITHUB_WORKSPACE/.shared-ci/scripts/tag-version.js" "$TAG" package.json

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node "$GITHUB_WORKSPACE/.shared-ci/scripts/changelog-section.js" CHANGELOG.md "$VERSION" \
            > "$RUNNER_TEMP/release/release-notes.md"

      # Packs only; publishing is the lead's step, with the lead's token.
      - name: npm pack
        run: npm pack --pack-destination "$RUNNER_TEMP/release"

      - name: Upload package and notes
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ github.event.repository.name }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
