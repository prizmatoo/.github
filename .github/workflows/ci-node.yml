# Reusable CI for BTWL TypeScript repos.
# Same steps everywhere: make setup, then make ci (lint, typecheck, test, build), then the
# coverage floor. The repo's Makefile owns the details; this workflow only provides the toolchain.
name: ci-node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json, .nvmrc and the Makefile
        type: string
        default: .
      coverage-path:
        description: Coverage output to upload as an artifact, relative to working-directory
        type: string
        default: coverage
      coverage-summary:
        description: Coverage summary read by the floor check, relative to working-directory
        type: string
        default: coverage/coverage-summary.json
      coverage-floor:
        description: Minimum total line coverage in percent; 0 turns the check off
        type: number
        default: 80
      junit-path:
        description: JUnit XML written by make test, relative to working-directory
        type: string
        default: reports/junit.xml
      shared-ci-ref:
        description: Ref of prizmatoo/.github whose scripts run the coverage check
        type: string
        default: main
    secrets:
      shared-ci-token:
        description: Read-only token for prizmatoo/.github (private repo); falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      # No version input on purpose: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      # pnpm store cache (BTWL-38: warm installs 21s instead of 94s cold).
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # A stalled cache download gives up after 2 minutes and make setup installs cold (~1.5 min);
      # the cache's default wait is 10 minutes, which looked like a hung install (BTWL-347).
      - name: Cache pnpm store
        uses: actions/cache@v4.2.3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: make setup
        run: make setup

      - name: make ci
        run: make ci

      # A green make ci without a JUnit report means make test stopped writing it.
      - name: Check the JUnit report exists
        env:
          JUNIT: ${{ inputs.junit-path }}
        run: test -s "$JUNIT" || { echo "::error title=junit::make test did not write $JUNIT"; exit 1; }

      # After make ci, so the repo's own lint never sees the extra checkout.
      - name: Check out shared CI scripts
        uses: actions/checkout@v4.2.2
        with:
          repository: prizmatoo/.github
          ref: ${{ inputs.shared-ci-ref }}
          path: .shared-ci
          token: ${{ secrets.shared-ci-token || github.token }}
          persist-credentials: false

      # Coverage of main for the change shown in the job summary (BTWL-424): main builds keep their
      # summary in the Actions cache, a PR build restores its base's (or the newest main one).
      # Never fails the job: without it the summary has no change column.
      - name: Restore main's coverage summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@v4.2.3
        with:
          path: .coverage-main
          key: coverage-main-${{ inputs.working-directory }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            coverage-main-${{ inputs.working-directory }}-

      # Fails below the floor; total, change against main and the files whose coverage moved go
      # to the job summary (no PR comment).
      - name: Coverage floor
        env:
          SUMMARY: ${{ inputs.coverage-summary }}
          FLOOR: ${{ inputs.coverage-floor }}
          BASE: ${{ github.event_name == 'pull_request' && format('{0}/.coverage-main/summary', github.workspace) || '' }}
        run: node "$GITHUB_WORKSPACE/.shared-ci/scripts/coverage-floor.js" "$SUMMARY" --floor "$FLOOR" --base "$BASE"

      - name: Keep main's coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUMMARY: ${{ inputs.coverage-summary }}
        run: |
          if [ -f "$SUMMARY" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.coverage-main"
            cp "$SUMMARY" "$GITHUB_WORKSPACE/.coverage-main/summary"
          fi

      - name: Save main's coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4.2.3
        with:
          path: .coverage-main
          key: coverage-main-${{ inputs.working-directory }}-${{ github.sha }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: warn
          retention-days: 14

      # Test results for the Xray import (BTWL-138): one artifact per repo and commit.
      # Also on failure: failing runs are the ones QA needs to see in Xray.
      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: junit-${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/${{ inputs.junit-path }}
          if-no-files-found: warn
          retention-days: 30
