# CI for this repo: the same reusable workflow the TypeScript repos call, from the local copy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-node.yml
    with:
      # node --test writes lcov, not istanbul json-summary.
      coverage-summary: coverage/lcov.info
      shared-ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}
