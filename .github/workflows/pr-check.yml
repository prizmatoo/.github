# Reusable PR check: branch, title and Jira link follow the traceability rules
# (branch BTWL-<n>, title "[BTWL-<n>] <summary>", body links the issue).
#
# Reports a failing check only. It never comments or reviews: no bot output on BTWL repos.
# Call it from the repo's own pull_request workflow, see README.md.
name: pr-check

on:
  workflow_call:
    inputs:
      shared-ci-ref:
        description: Ref of prizmatoo/.github whose scripts run the checks
        type: string
        default: main
    secrets:
      shared-ci-token:
        description: Read-only token for prizmatoo/.github (private repo); falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  traceability:
    name: branch, title and Jira link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out shared CI scripts
        uses: actions/checkout@v4.2.2
        with:
          repository: prizmatoo/.github
          ref: ${{ inputs.shared-ci-ref }}
          path: .shared-ci
          token: ${{ secrets.shared-ci-token || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22

      # Event values go through env, never straight into the script text.
      - name: Check branch, title and Jira link
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .shared-ci/scripts/pr-check.js
